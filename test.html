
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple CSS Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .layout {
            display: grid;

            grid-template-areas:
                ". header"
                "sidebar main"
                ". test2"
                "footer footer";

            grid-template-columns: 1fr 1fr;
            grid-gap: 16px;
            padding: 16px;
            min-height: 100vh;
        }
        .test1{
            grid-area: test1;
            background-color: red;
        }
        .test2{
            grid-area: test2;
            background-color: red;
        }

        .header {
            grid-area: header;
            background-color: #2563eb;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #1e293b;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            margin-bottom: 15px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
        }

        .main {
            grid-area: main;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        .main button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .footer {
            grid-area: footer;
            background-color: #334155;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
        }

        /* Responsive : écrans de moins de 600px */
        @media (max-width: 600px) {
            .layout {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";

                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <header class="header">
            <h1>Mon site web</h1>
        </header>

        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="#">Accueil</a></li>
                <li><a href="#">À propos</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </aside>

        <main class="main">
            <h2>Bienvenue !</h2>
            <p>
                Ceci est le contenu principal de notre site web.
                CSS Grid permet d'organiser facilement les éléments.
            </p>
            <button>Découvrir</button>
        </main>
        <div class="test1"><h1>test 1</h1></div>
        <div class="test2"><h1>test 2</h1></div>

        <footer class="footer">
            <p>© 2026 Mon site web</p>
        </footer>

    </div>

</body>
</html>
